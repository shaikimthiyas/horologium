name: "Bug Report"
description: "File a bug report or regression report for Horologium"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in Horologium.
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the bug and current behavior."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "Describe what should have happened."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment"
      placeholder: "e.g. Node 22.x, Chrome 130, Windows 11"
    validations:
      required: true
