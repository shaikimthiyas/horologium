name: Horologium Continuous Integration & Quality Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Automated Test Suite (Unit & Integration)
        env:
          CI: true
        run: npm test

      - name: Compile Production Multi-Page Vite Bundle
        run: npm run build

  docker-verification:
    name: Multi-Stage Container Build Verification (Rs 0 FOSS)
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Root Gateway Multi-Stage Dockerfile Build
        run: |
          docker build \
            --tag horologium-gateway:ci-test \
            --file Dockerfile \
            .

      - name: Verify Go Stratum-1 Daemon Multi-Stage Dockerfile Build
        run: |
          docker build \
            --tag horologium-stratum1:ci-test \
            --file server/ntp-stratum1/Dockerfile \
            server/ntp-stratum1

      - name: Validate Docker Compose Orchestration Config
        run: |
          docker compose config --quiet
