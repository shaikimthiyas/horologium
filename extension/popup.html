<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horologium Extension</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      background: #090B10;
      color: #EDEFF2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      user-select: none;
    }
    .ext-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #00F5D4; box-shadow: 0 0 6px #00F5D4;
    }
    .utc-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #00F5D4;
      background: rgba(0, 245, 212, 0.08);
      border: 1px solid rgba(0, 245, 212, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .city-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .city-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0F131C;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .city-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .city-title {
      font-size: 13px;
      font-weight: 600;
    }
    .city-meta {
      font-size: 10px;
      color: #8E95A2;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .city-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      color: #EDEFF2;
      font-variant-numeric: tabular-nums;
    }
    .ext-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      font-size: 11px;
      color: #8E95A2;
    }
    .btn-open-app {
      color: #00F5D4;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-open-app:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="ext-header">
    <div class="brand">
      <span class="dot"></span>
      <span>HOROLOGIUM</span>
    </div>
    <span class="utc-badge" id="extUtc">--:--:-- UTC</span>
  </div>

  <div class="city-list" id="cityList">
    <!-- Populated dynamically via popup.js -->
  </div>

  <div class="ext-footer">
    <span>Stratum-1 Calibrated</span>
    <a href="http://localhost:5173/horo/" target="_blank" class="btn-open-app">
      Open Full App →
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
