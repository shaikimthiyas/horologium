<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Machined Chronograph Vermilion Active Segment Fill -->
    <linearGradient id="calibre-vermilion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E24" />
      <stop offset="100%" stop-color="#FF4400" />
    </linearGradient>

    <!-- Super-LumiNova Cyan Colon Indicator -->
    <linearGradient id="calibre-luminova" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CE1E6" />
      <stop offset="100%" stop-color="#00E5B8" />
    </linearGradient>

    <!-- Recessed Instrument Well Shadow -->
    <linearGradient id="unlit-well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0D11" />
      <stop offset="100%" stop-color="#14171D" />
    </linearGradient>
  </defs>

  <!-- Tier 1: Anodized Tungsten Outer Chassis (#08090B) -->
  <rect width="64" height="64" rx="12" fill="#08090B" />
  
  <!-- Tier 2: Brushed Titanium Inner Dial Plate (#0E1014) with 1px Exposed Hairline Groove -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="9.5" fill="#0E1014" stroke="#EDEFF2" stroke-opacity="0.12" stroke-width="1" />
  
  <!-- Precision Tachymeter Corner Tick Marks -->
  <path d="M 8 6 H 12 M 6 8 V 12 M 56 6 H 52 M 58 8 V 12 M 8 58 H 12 M 6 56 V 52 M 56 58 H 52 M 58 56 V 52" stroke="#5A6270" stroke-width="1.2" stroke-linecap="square" />

  <!-- =======================================================================
       7-SEGMENT '8' MATRIX -> FORMING 'H'
       Unlit Segments (A: Top, D: Bottom) = Recessed CNC Well (#14171D)
       Active Segments (F, E: Left, B, C: Right, G: Center) = Vermilion (#FF4400)
       ======================================================================= -->
  <g transform="translate(10, 10)">
    <!-- SEGMENT A (Top Horizontal - UNLIT RECESSED GROOVE) -->
    <polygon points="6,2 24,2 21,6.5 9,6.5" fill="url(#unlit-well)" stroke="#EDEFF2" stroke-opacity="0.14" stroke-width="0.85" />

    <!-- SEGMENT D (Bottom Horizontal - UNLIT RECESSED GROOVE) -->
    <polygon points="9,37.5 21,37.5 24,42 6,42" fill="url(#unlit-well)" stroke="#EDEFF2" stroke-opacity="0.14" stroke-width="0.85" />

    <!-- SEGMENT F (Top-Left Vertical - ACTIVE VERMILION) -->
    <polygon points="4.5,3.5 8.5,7 8.5,19.5 4.5,21.5 2.5,19.5 2.5,5.5" fill="url(#calibre-vermilion)" />

    <!-- SEGMENT E (Bottom-Left Vertical - ACTIVE VERMILION) -->
    <polygon points="4.5,22.5 8.5,24.5 8.5,37 4.5,40.5 2.5,38.5 2.5,24.5" fill="url(#calibre-vermilion)" />

    <!-- SEGMENT B (Top-Right Vertical - ACTIVE VERMILION) -->
    <polygon points="25.5,3.5 27.5,5.5 27.5,19.5 25.5,21.5 21.5,19.5 21.5,7" fill="url(#calibre-vermilion)" />

    <!-- SEGMENT C (Bottom-Right Vertical - ACTIVE VERMILION) -->
    <polygon points="25.5,22.5 27.5,24.5 27.5,38.5 25.5,40.5 21.5,37 21.5,24.5" fill="url(#calibre-vermilion)" />

    <!-- SEGMENT G (Center Horizontal Crossbar - ACTIVE VERMILION) -->
    <polygon points="5.5,22 8.8,19.5 21.2,19.5 24.5,22 21.2,24.5 8.8,24.5" fill="url(#calibre-vermilion)" />
  </g>

  <!-- =======================================================================
       HOROLOGICAL COLON ':' (SUPER-LUMINOVA CYAN #00E5B8)
       ======================================================================= -->
  <g transform="translate(45, 10)">
    <!-- Upper Colon Jewel Bearing -->
    <rect x="0" y="10" width="6.5" height="6.5" rx="1.8" fill="#08090B" stroke="#EDEFF2" stroke-opacity="0.18" stroke-width="1" />
    <rect x="1.25" y="11.25" width="4" height="4" rx="1" fill="url(#calibre-luminova)" />

    <!-- Lower Colon Jewel Bearing -->
    <rect x="0" y="27.5" width="6.5" height="6.5" rx="1.8" fill="#08090B" stroke="#EDEFF2" stroke-opacity="0.18" stroke-width="1" />
    <rect x="1.25" y="28.75" width="4" height="4" rx="1" fill="url(#calibre-luminova)" />
  </g>
</svg>