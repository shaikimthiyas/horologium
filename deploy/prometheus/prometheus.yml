# ==============================================================================
# Prometheus Configuration for Horologium Telemetry Scraper
# ==============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'horologium-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:3001']
        labels:
          environment: 'production'
          service: 'horologium-telemetry-gateway'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
